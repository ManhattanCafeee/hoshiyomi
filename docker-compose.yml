services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: hoshiyomi
      MYSQL_USER: hoshiyomi
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - hoshiyomi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchangeme"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  hoshiyomi-mysql-data:
