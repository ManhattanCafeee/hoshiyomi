[package]
name = "hoshiyomi"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Web 框架与异步运行时
axum = "0.8"
tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.9", features = [ "runtime-tokio", "tls-rustls-ring-webpki", "mysql", "chrono" ] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# 环境变量加载
dotenvy = "0.15"

# 日志与跟踪(输出层由库的 telemetry 提供,见下方内部工具库)
tracing = "0.1"

# 认证与安全(会话/JWT/刷新令牌/口令全部由 vivarium 提供,见下方内部工具库)

# 校验
validator = { version = "0.20", features = ["derive"] }

# 中间件
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# 目录选择(local mode;库的 config 不做文件系统布局决策,故保留)
dirs = "6"

# CLI
clap = { version = "4", features = ["derive"] }
inquire = "0.9"

# 工具库
strum = { version = "0.28", features = ["derive"] }

# 内部工具库：错误/响应信封、校验提取器、数据访问、认证工具集、配置热重载、OpenAPI 挂载
vivarium-rs = { version = "0.3.3", default-features = false, features = ["web", "db-mysql", "config", "utoipa", "utoipa-ui", "telemetry"] }
figment = "0.10"
arc-swap = "1"

# OpenAPI 文档
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

[dev-dependencies]
http-body-util = "0.1"
